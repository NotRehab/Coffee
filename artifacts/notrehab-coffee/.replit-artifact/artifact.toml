kind = "web"
previewPath = "/"
title = "NOTrehabCoffee"
description = "A quiet luxury coffee storefront for NOTrehabCoffee, centered on an interactive coffee bean ritual and a curated collection of premium coffee bags."
version = "1.0.0"
id = "artifacts/notrehab-coffee"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20644

[services.development]
run = "pnpm --filter @workspace/notrehab-coffee run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/notrehab-coffee", "run", "build" ]
serve = "static"
publicDir = "artifacts/notrehab-coffee/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20644"
BASE_PATH = "/"
